plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.acrenex.app'

    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    def firebaseProperties = new Properties()
    def firebasePropertiesFile = rootProject.file('firebase.properties')
    if (firebasePropertiesFile.exists()) {
        firebasePropertiesFile.withInputStream { firebaseProperties.load(it) }
    }
    def firebaseApiKey = firebaseProperties.getProperty('firebase.apiKey', 'REPLACE_WITH_FIREBASE_API_KEY')
    def firebaseAppId = firebaseProperties.getProperty('firebase.appId', 'REPLACE_WITH_FIREBASE_APP_ID')
    def firebaseProjectId = firebaseProperties.getProperty('firebase.projectId', 'REPLACE_WITH_FIREBASE_PROJECT_ID')
    def firebaseStorageBucket = firebaseProperties.getProperty('firebase.storageBucket', 'REPLACE_WITH_FIREBASE_STORAGE_BUCKET')

    defaultConfig {
        applicationId "com.acrenex.app"
        minSdk 27
        targetSdk 36

        versionCode 1
        versionName "1.0"

        buildConfigField "String", "FIREBASE_API_KEY", "\"${firebaseApiKey}\""
        buildConfigField "String", "FIREBASE_APP_ID", "\"${firebaseAppId}\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"${firebaseProjectId}\""
        buildConfigField "String", "FIREBASE_STORAGE_BUCKET", "\"${firebaseStorageBucket}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                    getDefaultProguardFile(
                            'proguard-android-optimize.txt'
                    ),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    // Firebase cloud backend
    implementation platform('com.google.firebase:firebase-bom:34.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'

    // Android UI
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.13.0'

    // GIS - OpenStreetMap
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // OCR - Google ML Kit
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Local Database - Room
    implementation 'androidx.room:room-runtime:2.7.2'
    annotationProcessor 'androidx.room:room-compiler:2.7.2'

    // API Communication
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // Secure Network Client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
// Android Studio Gradle model compatibility.
// AcreNex is a Java/XML Android project and does not use Kotlin source code.
tasks.register("prepareKotlinBuildScriptModel") {
    group = "ide"
    description = "Compatibility task for Android Studio Gradle model sync."
}
